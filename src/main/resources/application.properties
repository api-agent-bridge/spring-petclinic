# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# GraphQL
# The endpoint is /graphql. GraphiQL is a browser client for trying queries, at /graphiql
spring.graphql.graphiql.enabled=true
# The largest number of fields one query may select, counted at every level of the query
petclinic.graphql.max-query-complexity=200

# External services behind the GraphQL schema
# Spring Web Services is here for its client. Petclinic does not serve any SOAP endpoints,
# so the server side, a MessageDispatcherServlet at /services, stays off.
spring.autoconfigure.exclude=org.springframework.boot.webservices.autoconfigure.WebServicesAutoConfiguration
# These are the live URLs. The "mock" profile points them at recorded responses instead,
# see application-mock.properties
petclinic.upstream.connect-timeout=10s
petclinic.upstream.read-timeout=10s
petclinic.upstream.antwerp.url=https://geodata.antwerpen.be/arcgissql/services/P_Portal/portal_publiek1/MapServer
petclinic.upstream.antwerp.map-name=portal_publiek1
petclinic.upstream.antwerp.layer-id=9
petclinic.upstream.antwerp.geocoder-url=https://geodata.antwerpen.be/arcgissql/services/LOC_CRAB/GeocodeServer
# How far from an owner's address to look for dog zones
petclinic.upstream.antwerp.search-radius-in-metres=2000
# The REST services are HTTP interfaces, each in a group of its own. Spring Boot reads the
# base URL and the timeouts of a group from spring.http.serviceclient.<group>.*
spring.http.serviceclient.ema.base-url=https://www.ema.europa.eu/en/documents/report
spring.http.serviceclient.ema.connect-timeout=${petclinic.upstream.connect-timeout}
# The read timeout covers the whole download, and the largest EMA report is 34 MB
spring.http.serviceclient.ema.read-timeout=60s
# EMA refreshes its reports twice a day, so the app keeps each download for 12 hours
petclinic.upstream.ema.refresh-after=12h
spring.http.serviceclient.rasff.base-url=https://webgate.ec.europa.eu/rasff-window/backend/public
spring.http.serviceclient.rasff.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.rasff.read-timeout=${petclinic.upstream.read-timeout}
spring.http.serviceclient.famhp.base-url=https://medicinesdatabase.be/api
spring.http.serviceclient.famhp.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.famhp.read-timeout=${petclinic.upstream.read-timeout}
spring.http.serviceclient.eurostat.base-url=https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data
spring.http.serviceclient.eurostat.connect-timeout=${petclinic.upstream.connect-timeout}
spring.http.serviceclient.eurostat.read-timeout=${petclinic.upstream.read-timeout}
# GBIF has more than 200 read operations, so one fetcher serves them all from an operation
# table (gbif/operations.json) instead of an HTTP interface
petclinic.upstream.gbif.url=https://api.gbif.org

# Internationalization
spring.messages.basename=messages/messages

#spring.ai.mcp.server.instructions="For any questions related to pets, vets, or pet products like pet food, pet health, pet clinics or anything related to pets, try using the searchSchema to see if our API can provide any details
# The MCP server, as clients list it
spring.ai.mcp.server.name=petclinic
# What a model reads before its first tool call. Petclinic's text replaces GATool's, so it
# repeats GATool's search, read and run loop after the topics of the API.
spring.ai.mcp.server.instructions=This server answers questions about a pet clinic and about public data on animals and pets. \
  The API holds the clinic's owners, their pets and visits, its vets and pet types, and the off-leash dog zones near owners in Antwerp. \
  It also reads public services: the medicines of the European Medicines Agency and the Belgian medicines agency, \
  EU alerts about food and pet food safety (RASFF), the prices of pets, pet products and veterinary care in EU countries \
  with the share of household spending on pets (Eurostat), and the names, classification, threat status and sightings of species (GBIF). \
  For a question on any of these topics, search the schema before you decide the API cannot answer it. \
  The three tools let you write GraphQL against the API: search the schema for the fields that answer the question, \
  read any type the search result names that you need to look inside, such as an input type you pass, then run the operation. \
  A refusal names what was wrong: read the types it names and correct the document before running it again.

#spring.ai.mcp.server.protocol= STREAMABLE
# Three tools let the model find its way through the schema and run a query it writes:
# searchSchema, introspectType and executeGraphql
gatool.dev.experimental.generate-tools=dynamic-three-step
# On purpose, the MCP server serves those three tools alone: this folder does not exist, so
# GATool does not read the curated operation files in gatool/mcp
gatool.mcp.operations.locations=optional:classpath*:gatool/none/
# searchSchema ranks the schema's fields by meaning, with a GraphQL-tuned embedding model in
# the local Ollama, pulled and named with:
#   ollama pull hf.co/xthor/Qwen3-Embedding-0.6B-GraphQL:Q8_0
#   ollama cp hf.co/xthor/Qwen3-Embedding-0.6B-GraphQL:Q8_0 qwen3-graphql-embedder
gatool.dev.experimental.dynamic-operations.search-backend=embedding
spring.ai.ollama.embedding.model=qwen3-graphql-embedder
# Tokens of search results one searchSchema call returns. The GBIF occurrence search alone
# costs 1,105 tokens, for its 151 arguments.
gatool.dev.experimental.dynamic-operations.search-token-budget=5000
# The embedding model reads a question as "Instruct: <task>\nQuery:<question>", the format
# Qwen3 embedding models are trained with. Schema fields are embedded without an instruction.
gatool.dev.experimental.dynamic-operations.question-prefix=Instruct: Given a question, retrieve the GraphQL schema field that answers it\nQuery:
# The Ollama starter brings Reactor Netty, which Spring Boot would then pick for every
# blocking HTTP client. This keeps the JDK client Petclinic used before, which follows
# redirects.
spring.http.clients.imperative.factory=jdk

# Needed for the demoing quickly!!!
gatool.mcp.security.unsafe.allow-mcp-calls-without-authentication=true

# MCP endpoint security
# The endpoint is an OAuth 2.1 resource server. Every call carries an access token from the
# Keycloak realm in keycloak/compose.yaml, and a call without one gets 401 with the address
# of the endpoint's metadata, which names the realm and the scopes to sign in for.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/petclinic
# MCP ties a token to the server it was issued for, named by the endpoint's canonical URL
gatool.mcp.security.resource=http://localhost:8080/mcp
spring.security.oauth2.resourceserver.jwt.audiences=http://localhost:8080/mcp
# Every tool needs mcp:tools. The five write tools also need petclinic:write, which their
# operation files name.
gatool.mcp.security.baseline-scopes=mcp:tools

# Actuator
# Expose all actuator endpoints for monitoring and management purposes
# Don't do this in production, only for development and testing
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE
# Every SOAP envelope the external service clients send and receive
# logging.level.org.springframework.ws.client.MessageTracing.sent=TRACE
# logging.level.org.springframework.ws.client.MessageTracing.received=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

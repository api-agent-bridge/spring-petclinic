# database init, supports mysql too
database=h2
spring.sql.init.schema-locations=classpath*:db/${database}/schema.sql
spring.sql.init.data-locations=classpath*:db/${database}/data.sql

# Web
spring.thymeleaf.mode=HTML

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategySnakeCaseImpl
spring.jpa.properties.hibernate.default_batch_fetch_size=16

# GraphQL
# The endpoint is /graphql. GraphiQL is a browser client for trying queries, at /graphiql
spring.graphql.graphiql.enabled=true
# The largest number of fields one query may select, counted at every level of the query
petclinic.graphql.max-query-complexity=200

# External services behind the GraphQL schema
# Spring Web Services is here for its client. Petclinic does not serve any SOAP endpoints,
# so the server side, a MessageDispatcherServlet at /services, stays off.
spring.autoconfigure.exclude=org.springframework.boot.webservices.autoconfigure.WebServicesAutoConfiguration
# These are the live URLs. The "mock" profile points them at recorded responses instead,
# see application-mock.properties
petclinic.upstream.connect-timeout=3s
petclinic.upstream.read-timeout=10s
petclinic.upstream.antwerp.url=https://geodata.antwerpen.be/arcgissql/services/P_Portal/portal_publiek1/MapServer
petclinic.upstream.antwerp.map-name=portal_publiek1
petclinic.upstream.antwerp.layer-id=9
petclinic.upstream.antwerp.geocoder-url=https://geodata.antwerpen.be/arcgissql/services/LOC_CRAB/GeocodeServer
# How far from an owner's address to look for dog zones
petclinic.upstream.antwerp.search-radius-in-metres=2000

# Internationalization
spring.messages.basename=messages/messages

#spring.ai.mcp.server.protocol= STREAMABLE
# Three tools let the model find its way through the schema and run a query it writes:
# searchSchema, introspectType and executeGraphql
gatool.dev.experimental.generate-tools=dynamic-three-step
# On purpose, the MCP server serves those three tools alone: this folder does not exist, so
# GATool does not read the curated operation files in gatool/mcp
gatool.mcp.operations.locations=optional:classpath*:gatool/none/
# searchSchema ranks the schema's fields by meaning, with a GraphQL-tuned embedding model in
# the local Ollama, pulled and named with:
#   ollama pull hf.co/xthor/Qwen3-Embedding-0.6B-GraphQL:Q8_0
#   ollama cp hf.co/xthor/Qwen3-Embedding-0.6B-GraphQL:Q8_0 qwen3-graphql-embedder
gatool.dev.experimental.dynamic-operations.search-backend=embedding
spring.ai.ollama.embedding.model=qwen3-graphql-embedder
# The Ollama starter brings Reactor Netty, which Spring Boot would then pick for every
# blocking HTTP client. This keeps the JDK client Petclinic used before, which follows
# redirects.
spring.http.clients.imperative.factory=jdk

# MCP endpoint security
# The endpoint is an OAuth 2.1 resource server. Every call carries an access token from the
# Keycloak realm in keycloak/compose.yaml, and a call without one gets 401 with the address
# of the endpoint's metadata, which names the realm and the scopes to sign in for.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/petclinic
# MCP ties a token to the server it was issued for, named by the endpoint's canonical URL
gatool.mcp.security.resource=http://localhost:8080/mcp
spring.security.oauth2.resourceserver.jwt.audiences=http://localhost:8080/mcp
# Every tool needs mcp:tools. The five write tools also need petclinic:write, which their
# operation files name.
gatool.mcp.security.baseline-scopes=mcp:tools

# Actuator
# Expose all actuator endpoints for monitoring and management purposes
# Don't do this in production, only for development and testing
management.endpoints.web.exposure.include=*

# Logging
logging.level.org.springframework=INFO
# logging.level.org.springframework.web=DEBUG
# logging.level.org.springframework.context.annotation=TRACE
# Every SOAP envelope the external service clients send and receive
# logging.level.org.springframework.ws.client.MessageTracing.sent=TRACE
# logging.level.org.springframework.ws.client.MessageTracing.received=TRACE

# Maximum time static resources should be cached
spring.web.resources.cache.cachecontrol.max-age=12h

# Mock mode: the external services are answered by a local server with recorded responses.
# Start it with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mock
# The recordings are in src/main/resources/mock-upstreams

petclinic.mock.port=9091
petclinic.mock.url=http://localhost:${petclinic.mock.port}

petclinic.upstream.antwerp.url=${petclinic.mock.url}/antwerp/arcgissql/services/P_Portal/portal_publiek1/MapServer
petclinic.upstream.antwerp.geocoder-url=${petclinic.mock.url}/antwerp/arcgissql/services/LOC_CRAB/GeocodeServer
spring.http.serviceclient.ema.base-url=${petclinic.mock.url}/ema/en/documents/report
spring.http.serviceclient.rasff.base-url=${petclinic.mock.url}/rasff/rasff-window/backend/public
spring.http.serviceclient.famhp.base-url=${petclinic.mock.url}/famhp/api
spring.http.serviceclient.eurostat.base-url=${petclinic.mock.url}/eurostat/eurostat/api/dissemination/statistics/1.0/data
petclinic.upstream.gbif.url=${petclinic.mock.url}/gbif
